<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MineTools</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <header>
    <img src="icons/icon48.png" width="40" height="40" alt="">
    <div><h1>MineTools</h1><p>从搜索结果中发现机会</p></div>
    <span class="version">1.3</span>
  </header>
  <main>
    <div class="eyebrow">GOOGLE 搜索采集</div>
    <h2>一页结果，一份清晰的数据。</h2>
    <p class="intro">汇总网页信息与网站指标，直接复制为 Markdown。</p>
    <ul class="fields">
      <li>网站名称 · 标题 · 地址 · 描述</li>
      <li>搜索关键词 · 结果总数 · 页面定位</li>
      <li>月访问量 · 停留时长 · 域名注册时间</li>
    </ul>
    <div id="status" role="status" aria-live="polite" data-state="loading">正在检查当前页面…</div>
    <button id="open-panel" type="button" disabled>打开采集面板 <span aria-hidden="true">↗</span></button>
    <p class="hint">在 Google 搜索结果页使用。AITDK 指标需要该扩展已启用，并显示在页面上。</p>
  </main>
  <footer><span class="dot" aria-hidden="true"></span> 本地采集 · 可拖动面板 · 一键复制</footer>
</body>
</html>
